<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DE Präpositionen Trainer</title>
  <meta name="description" content="Practice German verb prepositions with Akkusativ and Dativ cases using interactive flashcards." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-de">DE</span>
          <span class="logo-text">Präpositionen Trainer</span>
        </div>
        <div class="header-stats">
          <div class="stat-badge" id="stat-total">
            <span class="stat-num" id="total-count">0</span>
            <span class="stat-label">GESAMT</span>
          </div>
          <div class="stat-badge correct" id="stat-correct">
            <span class="stat-num" id="correct-count">0</span>
            <span class="stat-label">RICHTIG</span>
          </div>
          <div class="stat-badge wrong" id="stat-wrong">
            <span class="stat-num" id="wrong-count">0</span>
            <span class="stat-label">FALSCH</span>
          </div>
        </div>
      </div>
      <!-- Global Navigation -->
      <nav class="nav-bar">
        <a href="index.html" class="nav-link active">Trainer Startseite</a>
        <a href="pages/tenses.html" class="nav-link">Die 8 Zeitformen</a>
        <a href="pages/word-order.html" class="nav-link">Satzbau & Wortstellung</a>
        <a href="pages/connectors.html" class="nav-link">Konnektoren</a>
      </nav>
    </header>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="controls-inner">
        <div class="filter-group">
          <label class="filter-label">Kategorie:</label>
          <select id="filter-type" class="filter-select">
            <option value="all">Alle</option>
            <option value="vocabulary">Wortschatz</option>
            <option value="verb">Verben (Alle)</option>
            <option value="verb_preposition">Verben + Präpositionen</option>
            <option value="reflexive_verb">Reflexive Verben</option>
            <option value="konnektor">Konnektoren</option>
            <option value="konjunktion">Konjunktionen</option>
            <option value="phrase">Redewendungen</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Niveau:</label>
          <select id="filter-level" class="filter-select">
            <option value="all">Alle</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Modus:</label>
          <div class="filter-btns">
            <button class="filter-btn active" data-mode="sequential" id="mode-seq">Der Reihe nach</button>
            <button class="filter-btn" data-mode="random" id="mode-rand">Zufällig</button>
          </div>
        </div>
        <button class="btn-restart" id="btn-restart">Neustart</button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
      <span class="progress-text" id="progress-text">1 / 200</span>
    </div>

    <!-- Main Card Area -->
    <main class="main">
      <div class="card-container">
        <div class="card" id="card" tabindex="0">
          <div class="card-front" id="card-front">
            <div class="card-hint">Karte anklicken oder Leertaste drücken</div>
            <div class="verb-display" id="verb-display">achten</div>
            <div class="card-number" id="card-number">#1</div>
          </div>
          <div class="card-back" id="card-back">
            <div class="back-top">
              <div class="back-verb" id="back-verb">achten</div>
              <div class="prep-kasus">
                <div class="prep-tag" id="back-prep">auf</div>
                <div class="kasus-badge" id="back-kasus">Akk.</div>
              </div>
            </div>
            <div class="example-sentence" id="back-example"></div>
            <!-- Extra info section for translations, auxiliary verbs, or connector effects -->
            <div class="back-extra" id="back-extra"></div>
            <div class="answer-btns">
              <button class="btn-wrong" id="btn-wrong">Nicht gewusst</button>
              <button class="btn-correct" id="btn-correct">Gewusst!</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="card-nav">
        <button class="nav-btn" id="btn-prev">Zurück</button>
        <button class="nav-btn" id="btn-next">Weiter</button>
      </div>
    </main>

    <!-- Done screen -->
    <div class="done-screen" id="done-screen" style="display:none;">
      <div class="done-card">
        <div class="done-emoji"></div>
        <h2>Session Complete!</h2>
        <p>You went through all cards in this set.</p>
        <div class="done-stats">
          <div class="done-stat correct">
            <span id="done-correct">0</span>
            <small>Correct</small>
          </div>
          <div class="done-stat wrong">
            <span id="done-wrong">0</span>
            <small>Wrong</small>
          </div>
          <div class="done-stat pct">
            <span id="done-pct">0%</span>
            <small>Score</small>
          </div>
        </div>
        <button class="btn-restart big" id="btn-done-restart">Practice Again</button>
        <button class="btn-wrong-only" id="btn-wrong-only">Practice wrong ones only</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
